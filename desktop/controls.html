<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <title>VA 角色控制条</title>
  <link rel="stylesheet" href="/controls.css">
  <script type="module" src="/controls.js"></script>
</head>
<body>
  <nav aria-label="角色控制条">
    <span id="handle" title="拖动角色">⠿ VA</span>
    <button id="smaller" type="button" aria-label="缩小角色" title="缩小 5%">−</button>
    <output id="scale" aria-label="角色大小"></output>
    <button id="larger" type="button" aria-label="放大角色" title="放大 5%">+</button>
    <button id="settings" type="button">设置</button>
  </nav>
</body>
</html>
