name: Publish VA v1.0.0

on:
  push:
    tags: [v1.0.0]
    branches: [main]
    paths: [.github/workflows/release-v1.yml]

permissions:
  contents: read

env:
  RELEASE_TAG: v1.0.0

concurrency: va-v1-release

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v1.0.0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build and verify the Apple Silicon DMG
        run: |
          test "v$(node -p 'require("./package.json").version')" = "$RELEASE_TAG"
          test "$(uname -m)" = arm64
          make dmg
          codesign --verify --deep --strict dist/VA-darwin-arm64/VA.app
          hdiutil verify dist/VA-1.0.0-mac-arm64.dmg
          cd dist
          shasum -a 256 VA-1.0.0-mac-arm64.dmg > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: va-release
          compression-level: 0
          if-no-files-found: error
          path: |
            dist/VA-1.0.0-mac-arm64.dmg
            dist/SHA256SUMS.txt
            docs/releases/v1.0.0.md

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: va-release
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets \
              --jq '.isDraft == false and ([.assets[].name] | contains(["VA-1.0.0-mac-arm64.dmg", "SHA256SUMS.txt"]))' | grep -qx true; then
            exit 0
          fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "VA $RELEASE_TAG" --notes-file docs/releases/v1.0.0.md \
            dist/VA-1.0.0-mac-arm64.dmg dist/SHA256SUMS.txt
