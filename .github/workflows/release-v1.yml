name: Publish VA v1.0.0

on:
  push:
    tags: [v1.0.0]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build and verify the Apple Silicon DMG
        run: |
          test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
          test "$(uname -m)" = arm64
          make dmg
          codesign --verify --deep --strict dist/VA-darwin-arm64/VA.app
          hdiutil verify dist/VA-1.0.0-mac-arm64.dmg
          cd dist
          shasum -a 256 VA-1.0.0-mac-arm64.dmg > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: va-release
          compression-level: 0
          if-no-files-found: error
          path: |
            dist/VA-1.0.0-mac-arm64.dmg
            dist/SHA256SUMS.txt
            docs/releases/v1.0.0.md

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: va-release
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "VA $GITHUB_REF_NAME" --notes-file docs/releases/v1.0.0.md \
            dist/VA-1.0.0-mac-arm64.dmg dist/SHA256SUMS.txt
